<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#2a0845"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Concentric circles -->
  <g opacity="0.04" fill="none" stroke="white" stroke-width="1">
    <circle cx="400" cy="300" r="80"/><circle cx="400" cy="300" r="160"/>
    <circle cx="400" cy="300" r="240"/><circle cx="400" cy="300" r="320"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="300" cy="200" r="120" fill="#8b5cf6" opacity="0.15" filter="url(#glow4)"/>
  <circle cx="550" cy="350" r="100" fill="#6366f1" opacity="0.1" filter="url(#glow4)"/>
  <!-- Play button icon -->
  <g transform="translate(400,280)" filter="url(#glow4)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#accent4)" stroke-width="3"/>
    <!-- Play triangle -->
    <polygon points="-20,-35 -20,35 40,0" fill="none" stroke="url(#accent4)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Progress arc -->
    <path d="M-70,0 A70,70 0 0,1 70,0" fill="none" stroke="url(#accent4)" stroke-width="2" opacity="0.3" stroke-dasharray="80 140"/>
    <!-- Waveform bars -->
    <rect x="-80" y="-15" width="4" height="30" rx="2" fill="url(#accent4)" opacity="0.4"/>
    <rect x="-72" y="-25" width="4" height="50" rx="2" fill="url(#accent4)" opacity="0.5"/>
    <rect x="-64" y="-10" width="4" height="20" rx="2" fill="url(#accent4)" opacity="0.3"/>
    <rect x="72" y="-20" width="4" height="40" rx="2" fill="url(#accent4)" opacity="0.4"/>
    <rect x="80" y="-30" width="4" height="60" rx="2" fill="url(#accent4)" opacity="0.5"/>
    <rect x="88" y="-12" width="4" height="24" rx="2" fill="url(#accent4)" opacity="0.3"/>
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.9">UV PLAYER</text>
  <text x="400" y="550" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="white" opacity="0.4" letter-spacing="4">VIDEO PLAYER</text>
</svg>