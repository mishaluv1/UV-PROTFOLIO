<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#3a1c4e"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <linearGradient id="accent7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg7)"/>
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="800" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="800" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="600" cy="150" r="120" fill="#f59e0b" opacity="0.15" filter="url(#glow7)"/>
  <circle cx="200" cy="450" r="100" fill="#f97316" opacity="0.1" filter="url(#glow7)"/>
  <!-- House / property icon -->
  <g transform="translate(400,300)" filter="url(#glow7)">
    <!-- Roof -->
    <path d="M-90,-10 L0,-90 L90,-10" fill="none" stroke="url(#accent7)" stroke-width="3" stroke-linejoin="round"/>
    <!-- House body -->
    <rect x="-70" y="-10" width="140" height="100" rx="6" fill="none" stroke="url(#accent7)" stroke-width="3"/>
    <!-- Door -->
    <rect x="-15" y="40" width="30" height="50" rx="3" fill="none" stroke="url(#accent7)" stroke-width="2.5"/>
    <circle cx="8" cy="65" r="2" fill="url(#accent7)"/>
    <!-- Windows -->
    <rect x="-55" y="5" width="28" height="24" rx="3" fill="none" stroke="url(#accent7)" stroke-width="2" opacity="0.6"/>
    <line x1="-41" y1="5" x2="-41" y2="29" stroke="url(#accent7)" stroke-width="1.5" opacity="0.5"/>
    <line x1="-55" y1="17" x2="-27" y2="17" stroke="url(#accent7)" stroke-width="1.5" opacity="0.5"/>
    <rect x="27" y="5" width="28" height="24" rx="3" fill="none" stroke="url(#accent7)" stroke-width="2" opacity="0.6"/>
    <line x1="41" y1="5" x2="41" y2="29" stroke="url(#accent7)" stroke-width="1.5" opacity="0.5"/>
    <line x1="27" y1="17" x2="55" y2="17" stroke="url(#accent7)" stroke-width="1.5" opacity="0.5"/>
    <!-- Chimney -->
    <rect x="35" y="-70" width="16" height="30" rx="2" fill="none" stroke="url(#accent7)" stroke-width="2" opacity="0.6"/>
    <!-- Location pin -->
    <path d="M0,-130 C-14,-130 -22,-120 -22,-108 C-22,-92 0,-72 0,-72 C0,-72 22,-92 22,-108 C22,-120 14,-130 0,-130 Z" fill="none" stroke="url(#accent7)" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="-108" r="6" fill="url(#accent7)" opacity="0.7"/>
  </g>
  <!-- Label -->
  <text x="400" y="520" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.9">UV PROPERTIES</text>
  <text x="400" y="550" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="white" opacity="0.4" letter-spacing="4">REAL ESTATE</text>
</svg>
