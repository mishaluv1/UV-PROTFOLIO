<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b1b2f"/>
      <stop offset="50%" style="stop-color:#2d2d44"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- Dots pattern -->
  <g opacity="0.06">
    <circle cx="50" cy="50" r="2" fill="white"/><circle cx="150" cy="50" r="2" fill="white"/>
    <circle cx="250" cy="50" r="2" fill="white"/><circle cx="350" cy="50" r="2" fill="white"/>
    <circle cx="450" cy="50" r="2" fill="white"/><circle cx="550" cy="50" r="2" fill="white"/>
    <circle cx="650" cy="50" r="2" fill="white"/><circle cx="750" cy="50" r="2" fill="white"/>
    <circle cx="100" cy="150" r="2" fill="white"/><circle cx="200" cy="150" r="2" fill="white"/>
    <circle cx="300" cy="150" r="2" fill="white"/><circle cx="400" cy="150" r="2" fill="white"/>
    <circle cx="500" cy="150" r="2" fill="white"/><circle cx="600" cy="150" r="2" fill="white"/>
    <circle cx="700" cy="150" r="2" fill="white"/>
    <circle cx="50" cy="250" r="2" fill="white"/><circle cx="150" cy="250" r="2" fill="white"/>
    <circle cx="250" cy="250" r="2" fill="white"/><circle cx="350" cy="250" r="2" fill="white"/>
    <circle cx="450" cy="250" r="2" fill="white"/><circle cx="550" cy="250" r="2" fill="white"/>
    <circle cx="650" cy="250" r="2" fill="white"/><circle cx="750" cy="250" r="2" fill="white"/>
    <circle cx="100" cy="350" r="2" fill="white"/><circle cx="200" cy="350" r="2" fill="white"/>
    <circle cx="300" cy="350" r="2" fill="white"/><circle cx="400" cy="350" r="2" fill="white"/>
    <circle cx="500" cy="350" r="2" fill="white"/><circle cx="600" cy="350" r="2" fill="white"/>
    <circle cx="700" cy="350" r="2" fill="white"/>
    <circle cx="50" cy="450" r="2" fill="white"/><circle cx="150" cy="450" r="2" fill="white"/>
    <circle cx="250" cy="450" r="2" fill="white"/><circle cx="350" cy="450" r="2" fill="white"/>
    <circle cx="450" cy="450" r="2" fill="white"/><circle cx="550" cy="450" r="2" fill="white"/>
    <circle cx="650" cy="450" r="2" fill="white"/><circle cx="750" cy="450" r="2" fill="white"/>
    <circle cx="100" cy="550" r="2" fill="white"/><circle cx="200" cy="550" r="2" fill="white"/>
    <circle cx="300" cy="550" r="2" fill="white"/><circle cx="400" cy="550" r="2" fill="white"/>
    <circle cx="500" cy="550" r="2" fill="white"/><circle cx="600" cy="550" r="2" fill="white"/>
    <circle cx="700" cy="550" r="2" fill="white"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="200" cy="150" r="100" fill="#f59e0b" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="600" cy="400" r="110" fill="#ec4899" opacity="0.1" filter="url(#glow2)"/>
  <!-- Chef hat icon -->
  <g transform="translate(400,280)" filter="url(#glow2)">
    <!-- Hat base -->
    <rect x="-70" y="20" width="140" height="20" rx="4" fill="none" stroke="url(#accent2)" stroke-width="3"/>
    <!-- Hat puff -->
    <path d="M-60,20 C-60,-30 -30,-60 0,-60 C30,-60 60,-30 60,20" fill="none" stroke="url(#accent2)" stroke-width="3"/>
    <path d="M-40,20 C-40,-10 -20,-35 0,-35 C20,-35 40,-10 40,20" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.4"/>
    <!-- Plate -->
    <ellipse cx="0" cy="80" rx="80" ry="12" fill="none" stroke="url(#accent2)" stroke-width="2.5"/>
    <!-- Steam lines -->
    <path d="M-20,-60 C-25,-80 -15,-90 -20,-110" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.5"/>
    <path d="M0,-65 C5,-85 -5,-95 0,-115" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.5"/>
    <path d="M20,-60 C25,-80 15,-90 20,-110" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.9">COOKPEDIA</text>
  <text x="400" y="550" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="white" opacity="0.4" letter-spacing="4">RECIPE PLATFORM</text>
</svg>